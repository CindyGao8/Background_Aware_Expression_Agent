
roles:
  general:
    display_name: General User
    description: >
      A non-specialist user who wants a clear, direct, and easy-to-follow explanation
      without unnecessary technical depth.
    goal: Help the user understand the core idea, why it matters, and how it works at a practical level.
    detail_level: medium
    tone: clear, friendly, concise
    jargon_policy: minimize jargon; define technical terms when they are necessary
    preferred_structure:
      - Short definition
      - How it works
      - Why it matters
      - Simple example if helpful
    emphasize:
      - intuition
      - plain-language explanation
      - practical meaning
      - simple examples
    avoid:
      - heavy implementation details
      - unexplained acronyms
      - long architecture breakdowns
      - unsupported claims
    output_contract: >
      The answer should be understandable without prior domain knowledge and should avoid
      overwhelming the user with system-design or business-strategy details.

  pm:
    display_name: Product Manager
    description: >
      A product-focused stakeholder who cares about user needs, workflow, requirements,
      dependencies, risks, tradeoffs, and measurable success criteria.
    goal: Translate the concept into product implications and clarify how it affects user experience, delivery, and prioritization.
    detail_level: medium
    tone: structured, pragmatic, decision-oriented
    jargon_policy: use light technical language only when it supports product decisions
    preferred_structure:
      - Product summary
      - User problem or product goal
      - Workflow
      - Requirements and dependencies
      - Risks and open questions
      - Success metrics or PM takeaway
    emphasize:
      - user workflow
      - stakeholder handoffs
      - product requirements
      - tradeoffs
      - launch risks
      - measurable success metrics
    avoid:
      - low-level code details
      - overly academic definitions
      - unexplained model internals
      - vague claims such as better performance without metrics
    output_contract: >
      The answer should help a PM understand what needs to be built, what could go wrong,
      who depends on whom, and how success should be measured.

  engineer:
    display_name: Engineer
    description: >
      A technical builder who needs architecture, module responsibilities, interfaces,
      data/control flow, implementation alternatives, evaluation hooks, and failure modes.
    goal: Provide implementation-ready guidance without inventing unsupported configuration details.
    detail_level: high
    tone: precise, technical, structured
    jargon_policy: technical terms are allowed, but they should be used accurately and with context
    preferred_structure:
      - Technical summary
      - Components
      - Retrieval / data-control flow
      - Interfaces
      - Implementation notes
      - Useful implementation references
    emphasize:
      - architecture
      - module boundaries
      - inputs and outputs
      - retrieval design
      - chunking and metadata strategy
      - embedding/index alternatives
      - reranking and context assembly
      - evaluation metrics
      - failure modes
      - debugging hooks
    avoid:
      - generic advice without concrete methods
      - business-only framing
      - hard-coded model dimensions unless grounded by config
      - hard-coded chunk sizes unless grounded by config
      - unsupported latency, cost, or performance claims
    output_contract: >
      The answer should make clear how the system would be implemented and evaluated.
      For RAG-style topics, separate retrieval quality evaluation from final answer quality
      evaluation so downstream generation issues are not confused with retrieval failures.

  business:
    display_name: Business Owner
    description: >
      A business or leadership stakeholder who wants to understand value, operational impact,
      risks, decision points, and the level of effort without unnecessary technical detail.
    goal: Connect the concept to business outcomes, operational decisions, and risk management.
    detail_level: low_to_medium
    tone: executive, concise, outcome-oriented
    jargon_policy: avoid technical jargon unless it is essential for the decision
    preferred_structure:
      - Business takeaway
      - Value or expected outcome
      - Customer or operational impact
      - Risks and decision points
      - Effort or timeline at a high level
      - Recommended next step
    emphasize:
      - business value
      - operational impact
      - customer impact
      - cost or efficiency considerations when grounded
      - strategic risks
      - decision points
    avoid:
      - implementation-heavy explanations
      - code-level details
      - model-specific internals
      - ungrounded ROI or timeline claims
    output_contract: >
      The answer should help leadership decide whether the idea is worth pursuing,
      what value it may create, what risks must be managed, and what next decision is needed.
